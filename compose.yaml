name: dear-angel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dear_angel}
      POSTGRES_USER: ${POSTGRES_USER:-dear_angel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dear_angel_local_password}
      TZ: ${TZ:-America/Merida}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dear_angel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dear_angel_minio_password}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      TZ: ${TZ:-America/Merida}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dear_angel}:${POSTGRES_PASSWORD:-dear_angel_local_password}@postgres:5432/${POSTGRES_DB:-dear_angel}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dear_angel}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dear_angel_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-dear-angel-private}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-da_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      OTP_PEPPER: ${OTP_PEPPER:-dear_angel_local_otp_pepper}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v23.0}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es_MX}
      WHATSAPP_TEMPLATE_OTP: ${WHATSAPP_TEMPLATE_OTP:-}
      WHATSAPP_TEMPLATE_PASSWORD_RESET: ${WHATSAPP_TEMPLATE_PASSWORD_RESET:-}
      WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER: ${WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER:-}
      WHATSAPP_TEMPLATE_APPOINTMENT_UPDATE: ${WHATSAPP_TEMPLATE_APPOINTMENT_UPDATE:-}
      WHATSAPP_TEMPLATE_QUOTE_UPDATE: ${WHATSAPP_TEMPLATE_QUOTE_UPDATE:-}
      WHATSAPP_TEMPLATE_PAYMENT_UPDATE: ${WHATSAPP_TEMPLATE_PAYMENT_UPDATE:-}
      WHATSAPP_TEMPLATE_COUPON_UNLOCKED: ${WHATSAPP_TEMPLATE_COUPON_UNLOCKED:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-miniyahirpro@gmail.com}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Dear Angel Nail Studio}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/integrations/google-calendar/callback}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-dear-angel-local-integration-key-change-in-production}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      TZ: ${TZ:-America/Merida}
      REDIS_URL: redis://redis:6379
    ports:
      - '3002:3002'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
      API_INTERNAL_URL: http://api:3001/api
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  preview:
    image: cloudflare/cloudflared:latest
    profiles: ['preview']
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', '--protocol', 'http2', '--url', 'http://web:3000']
    depends_on:
      web:
        condition: service_healthy

  stable-preview:
    image: ngrok/ngrok:latest
    profiles: ['stable-preview']
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command:
      [
        'http',
        '--url=https://${NGROK_DOMAIN:-configure-your-domain.ngrok-free.app}',
        '--log=stdout',
        '--log-format=json',
        'http://web:3000',
      ]
    depends_on:
      web:
        condition: service_healthy

  backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    image: dear-angel-backup
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Merida}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-dear_angel}
      PGUSER: ${POSTGRES_USER:-dear_angel}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dear_angel_local_password}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dear_angel}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dear_angel_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-dear-angel-private}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-604800}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/backup-ready']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  restore:
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    image: dear-angel-backup
    profiles: ['tools']
    entrypoint: ['/opt/dear-angel/restore.sh']
    environment:
      TZ: ${TZ:-America/Merida}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-dear_angel}
      PGUSER: ${POSTGRES_USER:-dear_angel}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dear_angel_local_password}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dear_angel}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dear_angel_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-dear-angel-private}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
